services:
  postgres:
    image: postgres:16-alpine
    container_name: lawn-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lawn
      POSTGRES_PASSWORD: lawn_dev
    volumes:
      - lawn_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawn"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lawn_pg_data:
